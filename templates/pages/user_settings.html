{% extends "pages/base.html" %}

{% block title %}User settings{% endblock %}
{% block body_class %}wide{% endblock %}

{% block content %}
<div class="settings-layout">
    <aside class="settings-sidebar">
        <p class="settings-eyebrow">User Settings</p>
        <nav class="settings-nav" aria-label="Settings sections">
            <a href="#notifications">Notifications</a>
        </nav>
    </aside>

    <main class="settings-main">
        <h1>Notifications</h1>
        <p class="settings-intro">Choose which activity updates you receive by email.</p>
        <section id="notifications" class="settings-card">
            <form method="post" action="/{{ layout.org_slug }}/settings/user/notifications">
                <label class="settings-switch-row">
                    New comments
                    <input type="checkbox" name="notify_comments" {% if notify_comments %}checked{% endif %}>
                    <span class="settings-switch" aria-hidden="true"><span></span></span>
                </label>
                <label class="settings-switch-row">
                    Status changes
                    <input type="checkbox" name="notify_status_changes" {% if notify_status_changes %}checked{% endif %}>
                    <span class="settings-switch" aria-hidden="true"><span></span></span>
                </label>
                <label class="settings-switch-row">
                    Ideas you follow are shipped
                    <input type="checkbox" name="notify_shipped" {% if notify_shipped %}checked{% endif %}>
                    <span class="settings-switch" aria-hidden="true"><span></span></span>
                </label>
                <button type="submit">Save preferences</button>
            </form>
        </section>
    </main>
</div>
{% endblock %}
