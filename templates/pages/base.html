<!DOCTYPE html>
<!--suppress HtmlUnknownTarget -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Featherboard{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
    {% if let Some(color) = layout.accent_color %}
    <style>:root { --accent: {{ color }}; }</style>
    {% endif %}
    <script src="/static/htmx.min.js" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
<div class="nav-bar">
    <nav class="main-nav">
        {% if let Some(logo) = layout.logo_url %}
        <a href="/{{ layout.org_slug }}">
            <img src="{{ logo }}" alt="logo" class="org-logo">
        </a>
        {% endif %}
        <a href="/{{ layout.org_slug }}">Board</a>
        <a href="/{{ layout.org_slug }}/roadmap">Roadmap</a>
        <a href="/{{ layout.org_slug }}/changelogs">Changelog</a>
    </nav>
    <nav class="login-nav">
        {% if layout.is_logged_in %}
        <details class="account-menu">
            <summary class="account-trigger" aria-label="Account menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </summary>
            <div class="account-dropdown">
                {% if layout.is_admin %}
                <a href="/{{ layout.org_slug }}/settings">Settings</a>
                <div class="account-dropdown-divider"></div>
                {% endif %}
                <a href="/{{ layout.org_slug }}/logout">Log out</a>
            </div>
        </details>
        {% else %}
        <a class="cta-outline" href="/{{ layout.org_slug }}/login"><span>Log in</span></a>
        {% endif %}
    </nav>
</div>
{% block content %}{% endblock %}
</body>
</html>
