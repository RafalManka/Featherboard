<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Featherboard{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
<div class="nav-bar">
    <nav class="main-nav">
        <a href="/{{ org_slug }}">Board</a>
        <a href="/{{ org_slug }}/roadmap">Roadmap</a>
        <a href="/{{ org_slug }}/changelogs">Changelog</a>
    </nav>
    <nav class="login-nav">
        {% if is_logged_in %}
        <a class="cta-outline" href="/{{ org_slug }}/logout"><span>Log out</span></a>
        {% else %}
        <a class="cta-outline" href="/{{ org_slug }}/login"><span>Log in</span></a>
        {% endif %}
    </nav>
</div>
{% block content %}{% endblock %}
</body>
</html>
