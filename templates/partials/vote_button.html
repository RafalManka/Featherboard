<button hx-post="/{{ layout.org_slug }}/ideas/{{ item.idea.id }}/vote"
        hx-target="this"
        hx-swap="outerHTML"
        hx-disabled-elt="this"
        class="vote-btn{% if item.voted %} voted{% endif %}">
    <span class="vote-arrow" aria-hidden="true">&#9650;</span>
    <span class="vote-count">{{ item.vote_count }}</span>
</button>
